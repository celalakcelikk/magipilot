name: Release

# A pushed v* tag builds, tests and packages the extension and creates the GitHub Release.
# Publishing to the Marketplace and Open VSX is off until the repository variables
# PUBLISH_MARKETPLACE and PUBLISH_OPENVSX are 'true' (RELEASING.md).
# To publish an existing version later: gh workflow run release.yml --ref v<version>
# The run then reuses the Release and its .vsix instead of building again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'celalakcelikk/magipilot' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      vsix: ${{ steps.names.outputs.vsix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        id: names
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "vsix=magipilot-$version.vsix" >> "$GITHUB_OUTPUT"
      - name: Does the GitHub Release exist?
        id: existing
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, test and package
        if: steps.existing.outputs.found == 'false'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run package
          npm run package:check
      - name: Create the GitHub Release
        if: steps.existing.outputs.found == 'false'
        env:
          VSIX: ${{ steps.names.outputs.vsix }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Magipilot $version" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed. Install the attached .vsix with **Extensions › … › Install from VSIX…**, or run \`code --install-extension $VSIX\`."
      - name: Reuse the Release's .vsix
        if: steps.existing.outputs.found == 'true'
        env:
          VSIX: ${{ steps.names.outputs.vsix }}
        # Every registry gets the bytes the GitHub Release carries; a missing asset fails here.
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.names.outputs.vsix }}
          if-no-files-found: error

  marketplace:
    needs: release
    if: vars.PUBLISH_MARKETPLACE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish to the Visual Studio Marketplace (Trusted Publishing)
        env:
          VSIX: ${{ needs.release.outputs.vsix }}
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath "$VSIX"

  openvsx:
    needs: release
    if: vars.PUBLISH_OPENVSX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish to Open VSX
        env:
          VSIX: ${{ needs.release.outputs.vsix }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath "$VSIX" -p "$OVSX_PAT"
